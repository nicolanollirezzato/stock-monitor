name: Monitoraggio Azioni

on:
  schedule:
    # Ogni 5 minuti. NOTA: GitHub esegue i cron "best effort":
    # in periodi di carico elevato può ritardare di qualche minuto.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permette anche l'avvio manuale dalla tab "Actions"

# Evita che due esecuzioni sovrapposte scrivano contemporaneamente sullo
# storico delle previsioni: le esecuzioni vengono messe in coda invece che
# girare in parallelo.
concurrency:
  group: stock-monitor
  cancel-in-progress: false

# Necessario per poter salvare (commit) lo storico delle previsioni nel repository.
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui monitoraggio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salva lo storico delle previsioni
        run: |
          mkdir -p data
          touch data/alerts_log.jsonl
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/alerts_log.jsonl
          git diff --cached --quiet || git commit -m "Aggiorna storico previsioni [skip ci]"
          git push || echo "Push non riuscito (probabile esecuzione concorrente): si riproverà al prossimo ciclo."

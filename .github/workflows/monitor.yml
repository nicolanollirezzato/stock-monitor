name: Monitoraggio Azioni

on:
  schedule:
    # Ogni 5 minuti. NOTA: GitHub esegue i cron "best effort":
    # in periodi di carico elevato può ritardare di qualche minuto.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permette anche l'avvio manuale dalla tab "Actions"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui monitoraggio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

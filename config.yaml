# =========================================================
# CONFIGURAZIONE STRUMENTO DI MONITORAGGIO AZIONI
# =========================================================

# Elenco dei ticker da monitorare SEMPRE, indipendentemente dallo scouting
# (formato Yahoo Finance, es. AAPL, MSFT, NVDA)
tickers:
  - AAPL
  - MSFT
  - NVDA

# =========================================================
# SCOUTING AUTOMATICO (ricerca di nuove opportunità)
# =========================================================
scouting:
  enabled: true

  # Universo su cui cercare: per ora supportato "sp500" (S&P 500, mercato USA)
  universe: sp500

  # Quanti titoli "top mover" del momento passare alla checklist dettagliata
  # ad ogni ciclo (oltre a quelli della watchlist fissa)
  top_n: 10

  # Peso minimo di variazione % giornaliera per essere considerato interessante
  min_abs_change_pct: 2.0

  # Rapporto volume attuale / media che rende un titolo interessante per lo scouting
  # (corretto in base a quanto è avanzata la giornata di borsa)
  min_volume_ratio: 1.5

  # Range intraday di oggi (high-low rispetto all'apertura) che segnala
  # volatilità intraday anche se il prezzo attuale è tornato vicino a ieri
  # (cattura i casi "balzo e rientro" che il solo cambio % giornaliero perde)
  min_intraday_range_pct: 3.0

  # Ogni quanti minuti rifare la scansione completa dei 500 titoli, invece
  # di riusare il risultato del ciclo precedente. Impostato a 5 (= ogni
  # ciclo) per privilegiare la prontezza nel cogliere cambi repentini;
  # aumenta questo numero se preferissi ridurre il carico su Yahoo Finance
  # a scapito di un po' di reattività.
  refresh_minutes: 5

# Soglie della checklist di valutazione
thresholds:
  # Variazione percentuale di prezzo (intraday, ultimi ~5 minuti) usata SOLO
  # come riserva se non c'è abbastanza storico per calcolare una soglia
  # adattiva (vedi sotto). Normalmente la soglia reale è calcolata sulla
  # volatilità storica del singolo titolo, non su questo numero fisso.
  price_change_5m_pct: 0.5

  # Variazione percentuale di prezzo giornaliera, stessa logica di riserva
  # (soglia reale normalmente adattiva, vedi sotto).
  price_change_1d_pct: 3.0

  # --- Soglie adattive alla volatilità storica (fattori 1 e 2) ---
  # Un titolo scatta quando il movimento supera "volatility_multiplier"
  # deviazioni standard della sua volatilità storica (calcolata sui
  # rendimenti giornalieri degli ultimi ~60 giorni), invece di un numero
  # fisso identico per tutti i titoli. 2.0 = cattura all'incirca il 5% dei
  # movimenti giornalieri più insoliti per quel singolo titolo.
  volatility_multiplier: 2.0

  # Pavimenti minimi: anche se la volatilità storica del titolo è bassissima,
  # non scattare sotto queste percentuali (evita falsi allarmi rumorosi sui
  # titoli storicamente molto calmi).
  price_change_5m_floor_pct: 0.15
  price_change_1d_floor_pct: 1.0

  # Quante barre da 5 minuti guardare indietro per il fattore "movimento
  # rapido", oltre all'ultima singola barra: cattura anche un accumulo "a
  # scalini" su più barre consecutive che singolarmente non supererebbero
  # mai la soglia. 4 barre = ~20 minuti.
  price_5m_window_bars: 4

  # Volume attuale / volume medio storico (es. 2.0 = doppio del normale)
  volume_spike_ratio: 2.0

  # Numero di notizie rilevanti trovate nelle ultime N ore per considerarle un fattore
  news_lookback_hours: 6
  news_min_count: 2

  # Periodo medie mobili (in giorni) per il segnale tecnico
  sma_short: 5
  sma_long: 20

  # Punteggio minimo (somma dei fattori attivati) per inviare un alert Telegram
  # Ogni fattore vale 1 punto (max 4: prezzo, volume, news, incrocio medie)
  alert_score_threshold: 2

# Parole chiave (case-insensitive) OPZIONALI per filtrare ulteriormente le
# notizie del singolo titolo (che arrivano già da Ticker.news, quindi già
# pertinenti). Lascia la lista vuota per considerare rilevante qualunque
# notizia recente associata al titolo, senza filtro aggiuntivo.
news_keywords: []

# =========================================================
# SENTIMENT NOTIZIE (opzionale, richiede una chiave Alpha Vantage gratuita)
# =========================================================
sentiment:
  # Se true ma manca la chiave ALPHA_VANTAGE_API_KEY (secret GitHub), viene
  # semplicemente saltato: il resto dello strumento funziona normalmente.
  enabled: true

# =========================================================
# AUTOVALUTAZIONE (tracking delle previsioni per il report)
# =========================================================
tracking:
  # Dopo quante ore da un alert si controlla se la direzione prevista
  # (rialzista/ribassista) si è rivelata corretta, confrontando il prezzo.
  horizon_hours: 24

# =========================================================
# MATERIE PRIME (analisi separata dai singoli titoli)
# =========================================================
commodities:
  enabled: true

  # Quante ore indietro guardare per le notizie sulle materie prime
  lookback_hours: 6

  # Numero minimo di notizie pertinenti per far scattare l'alert su una categoria
  min_count_for_alert: 2

  categories:
    petrolio:
      keywords:
        - crude oil
        - wti
        - brent
        - opec
        - opec+
        - petrolio
        - greggio
    gas_naturale:
      keywords:
        - natural gas
        - gas naturale
        - lng
        - henry hub
        - gasdotto
    metalli_preziosi:
      keywords:
        - gold
        - oro
        - silver
        - argento
        - bullion
        - platinum
        - platino
    metalli_industriali:
      keywords:
        - copper
        - rame
        - aluminum
        - alluminio
        - lithium
        - litio
        - nickel
        - nichel
        - miniera
        - mining

  # Feed RSS specializzati in materie prime. NOTA: verifica ogni tanto che
  # questi indirizzi siano ancora validi, i siti a volte cambiano struttura.
  feeds:
    - name: "OilPrice.com"
      url: "https://oilprice.com/rss/main"
    - name: "Mining.com"
      url: "https://www.mining.com/feed/"
    - name: "Reuters Commodities"
      url: "https://feeds.reuters.com/reuters/commoditiesNews"
